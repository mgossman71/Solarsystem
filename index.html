<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E" />
  <title>Earth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* [hidden] must win over any display set on .ui-btn / .seg-btn etc. */
    [hidden] { display: none !important; }
    button { -webkit-user-select: none; user-select: none; }

    /* ---- Planet labels (System / wide view) ----
       A fixed overlay pinned to the canvas; each planet's 3D position is
       projected to screen space every frame and written onto the matching
       .planet-label. pointer-events:none keeps the layer from intercepting
       orbit/zoom/tap — the body's delegated click handler still fires. */
    #planet-labels {
      position: fixed;
      inset: 0;
      /* Below the control panels (z-index 12): a pill that lands over the
         Explore/Sun panel must not paint over it or steal its clicks. */
      z-index: 11;
      pointer-events: none;
      overflow: hidden;
    }
    .planet-label {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, calc(-100% - 10px));
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px 3px 7px;
      background: rgba(10, 14, 24, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px) saturate(1.2);
      -webkit-backdrop-filter: blur(8px) saturate(1.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      will-change: left, top;
      pointer-events: auto;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .planet-label:hover {
      background: rgba(18, 26, 44, 0.78);
      border-color: rgba(143, 208, 255, 0.55);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 0 12px rgba(143, 208, 255, 0.25);
    }
    .planet-label:active {
      background: rgba(28, 40, 66, 0.85);
      border-color: rgba(143, 208, 255, 0.85);
    }
    .planet-label .planet-label-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #8fd0ff;
      box-shadow: 0 0 6px rgba(143, 208, 255, 0.9);
    }
    /* Moon name pills — same glass pill one step smaller, warm dot so they
       read as "sub-bodies". Shown only while a planet (or one of its moons)
       is focused; never in the System overview (see .moon-label usage in
       updatePlanetLabels). Inherits hover/active/pointer styles from the
       .planet-label base class above. */
    .moon-label {
      padding: 2px 8px 2px 6px;
      border-radius: 11px;
      font-size: 10px;
    }
    .moon-label .planet-label-dot {
      width: 5px;
      height: 5px;
      background: #ffd9a0;
      box-shadow: 0 0 6px rgba(255, 217, 160, 0.9);
    }
    /* ---- Primary bar (desktop, bottom center) ---- */
    .primary-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px 12px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 20;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      background: rgba(12, 16, 28, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      backdrop-filter: blur(16px) saturate(1.25);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }
    .primary-bar:hover { opacity: 1; }
    .pb-group { display: flex; align-items: center; gap: 6px; }
    .pb-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.14); }
    .pb-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; color: rgba(255,255,255,0.45); margin-right: 2px;
      pointer-events: none;
    }

    /* ---- Loading overlay (removed by EarthScene on completion) ---- */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      transition: opacity 0.6s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .loading-inner {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      width: min(320px, 72vw);
    }
    .loading-title {
      font-size: 44px; line-height: 1;
      filter: drop-shadow(0 2px 24px rgba(60,130,246,0.45));
      animation: loading-bob 2.4s ease-in-out infinite;
    }
    @keyframes loading-bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-6px) rotate(4deg); }
    }
    .loading-track {
      width: 100%; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.12); overflow: hidden;
    }
    #loading-fill {
      height: 100%; width: 0%; border-radius: 4px;
      background: linear-gradient(90deg, #3c82f6, #7fb2ff);
      transition: width 0.3s ease;
    }
    #loading-label {
      font-size: 12px; color: rgba(255,255,255,0.5);
      letter-spacing: 0.4px; min-height: 16px; text-align: center;
    }

    /* ---- Mobile bottom sheet (collapsed peek = always-visible controls) ---- */
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 100vh; height: 100dvh;
      background: rgba(10, 14, 24, 0.96);
      border-top: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px 18px 0 0;
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      box-shadow: 0 -18px 50px rgba(0,0,0,0.55);
      z-index: 30;
      display: none; /* enabled only on mobile via media query */
      transform: translateY(calc(100vh - 76px));
      transform: translateY(calc(100dvh - 76px));
      transition: transform 0.32s cubic-bezier(0.3, 0.9, 0.3, 1), opacity 0.4s ease;
      will-change: transform;
      overflow: hidden;
    }
    .sheet-handle {
      padding: 8px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      cursor: grab; touch-action: none;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sheet-handle:active { cursor: grabbing; }
    .sheet-grabber {
      width: 40px; height: 5px; border-radius: 5px; margin: 0 auto 2px;
      background: rgba(255,255,255,0.28);
    }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; }
    .sheet-title {
      font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
      color: rgba(255,255,255,0.88);
    }
    .sheet-actions { display: flex; align-items: center; gap: 8px; }
    .sheet-toggle {
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(60,130,246,0.18); border: 1px solid rgba(60,130,246,0.4);
      color: rgba(160,200,255,0.95); font-size: 19px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease;
    }
    .sheet-toggle.active { background: rgba(60,130,246,0.34); }
    .sheet-close {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.8); font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-body {
      padding: 4px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 20px;
    }
    .sheet-section h3 {
      font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
      color: rgba(255,255,255,0.5); margin: 0 0 10px;
    }
    .sheet-seg { flex-wrap: wrap; }
    .sheet-seg .seg-btn { padding: 10px 14px; min-height: 44px; font-size: 13px; }
    .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toggle-grid .ui-btn {
      min-height: 46px; text-align: center;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }

    /* ---- Interaction dimming: fade secondary chrome while the camera is driven ---- */
    body.interacting .sheet,
    body.interacting .sun-panel,
    body.interacting .focus-panel,
    body.interacting .primary-bar,
    body.interacting .hint-text { opacity: 0.15; }
    .ui-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      user-select: none;
    }
    .ui-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .ui-btn.active {
      background: rgba(60, 130, 246, 0.2);
      border-color: rgba(60, 130, 246, 0.4);
      color: rgba(140, 190, 255, 0.95);
    }
    .hint-text {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 2s ease;
    }

    /* ---------------- Sun Lighting panel ---------------- */
    .sun-panel {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 232px;
      z-index: 12;
      background: rgba(12, 16, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      backdrop-filter: blur(16px) saturate(1.25);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      padding: 14px;
      opacity: 0.82;
      transition: opacity 0.3s ease;
    }
    .sun-panel:hover { opacity: 1; }
    .sun-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .sun-panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }
    .sun-head-actions { display: flex; gap: 6px; align-items: center; }
    .sun-auto-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sun-auto-btn:hover { background: rgba(255, 255, 255, 0.13); }
    .sun-auto-btn.active {
      background: rgba(255, 190, 90, 0.2);
      border-color: rgba(255, 190, 90, 0.5);
      color: rgba(255, 208, 138, 0.98);
    }
    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .sun-body.hidden { display: none; }

    /* Pad (draggable Sun dial) */
    .sun-pad-wrap { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
    .sun-pad {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, rgba(70, 110, 190, 0.28), rgba(8, 12, 22, 0.72) 72%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: grab;
      touch-action: none;
      flex: 0 0 auto;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.4);
    }
    .sun-pad:active { cursor: grabbing; }
    .sun-pad::before, .sun-pad::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .sun-pad::before { left: 50%; top: 16px; bottom: 16px; width: 1px; transform: translateX(-0.5px); }
    .sun-pad::after { top: 50%; left: 16px; right: 16px; height: 1px; transform: translateY(-0.5px); }
    .sun-pad-ring {
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    .sun-pad-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff3d6, #ffb63e 55%, #ff8a1e);
      box-shadow: 0 0 14px rgba(255, 180, 60, 0.8), 0 0 4px rgba(255, 224, 158, 0.9);
      pointer-events: none;
      will-change: transform;
    }
    .sun-readout {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      min-width: 62px;
    }
    .sun-readout b { color: rgba(255, 255, 255, 0.92); font-weight: 600; }

    /* Sliders */
    .sun-sliders { display: flex; flex-direction: column; gap: 11px; margin-bottom: 14px; }
    .sun-slider-row { display: flex; align-items: center; gap: 10px; }
    .sun-slider-row label { font-size: 11px; color: rgba(255, 255, 255, 0.5); width: 56px; flex: 0 0 auto; }
    .sun-range {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
    }
    .sun-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(255, 180, 60, 0.85);
      box-shadow: 0 0 6px rgba(255, 180, 60, 0.5);
      cursor: pointer;
    }
    .sun-range::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(255, 180, 60, 0.85);
      cursor: pointer;
    }

    /* Orbit-ring brightness slider (shared by the desktop bar + mobile sheet) */
    .ring-range {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
    }
    .ring-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(111, 134, 166, 0.9);
      box-shadow: 0 0 6px rgba(111, 134, 166, 0.5);
      cursor: pointer;
    }
    .ring-range::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(111, 134, 166, 0.9);
      cursor: pointer;
    }
    /* Desktop focus-panel: the ring slider fills its row next to the label */
    .focus-panel .ring-range { flex: 1; min-width: 110px; }
    /* Mobile sheet: a full-width labelled row */
    .ring-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .ring-row .ring-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; color: rgba(255, 255, 255, 0.5); flex: 0 0 auto;
    }
    .ring-row .ring-range { flex: 1; }

    /* Presets */
    .sun-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .sun-preset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.75);
      padding: 7px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .sun-preset:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .sun-preset-full { grid-column: 1 / -1; }
    .sun-preset.active {
      background: rgba(60, 130, 246, 0.22);
      border-color: rgba(60, 130, 246, 0.55);
      color: rgba(175, 208, 255, 0.98);
      box-shadow: 0 0 10px rgba(60, 130, 246, 0.25);
    }
    /* Full Daylight active: the manual Sun controls stay visible but are
       clearly overridden — dimmed and non-interactive. */
    .sun-panel.full-daylight .sun-manual { opacity: 0.4; pointer-events: none; }
    .sun-softfill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }
    .sun-softfill input { accent-color: #ffb63e; cursor: pointer; }
    .sun-reset {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.82);
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sun-reset:hover { background: rgba(255, 255, 255, 0.15); }

    /* ---------------- Debug panel (?debug) ---------------- */
    .debug-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      max-width: 280px;
      background: rgba(10, 14, 24, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .debug-title {
      width: 100%;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2px;
    }
    .debug-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }
    .debug-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .debug-btn.active {
      background: rgba(60, 130, 246, 0.3);
      border-color: rgba(60, 130, 246, 0.6);
      color: #cfe1ff;
    }

    /* ---------------- Explore (focus) panel ---------------- */
    .focus-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 12;
      background: rgba(12, 16, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      backdrop-filter: blur(16px) saturate(1.25);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      color: rgba(255, 255, 255, 0.85);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0.82;
      transition: opacity 0.3s ease;
      max-width: min(340px, calc(100vw - 40px));
    }
    .focus-panel:hover { opacity: 1; }
    .focus-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .focus-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }
    .seg-group {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2px;
    }
    .seg-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .seg-btn:hover { color: #fff; }
    .seg-btn.active {
      background: rgba(60, 130, 246, 0.3);
      color: #cfe1ff;
    }
    /* ================= MOBILE LAYOUT (<= 768px) ================= */
    @media (max-width: 768px) {
      .primary-bar, .focus-panel { display: none; }
      .sheet { display: block; }

      .hint-text {
        top: calc(14px + env(safe-area-inset-top, 0px));
        font-size: 12px;
        z-index: 10;
      }

      /* Sun panel becomes a top-anchored, collapsible full-width panel. */
      .sun-panel {
        top: calc(12px + env(safe-area-inset-top, 0px));
        right: 12px;
        left: 12px;
        transform: none;
        width: auto;
        max-height: 46vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        opacity: 1;
      }
      .sun-panel.collapsed { max-height: none; overflow: visible; box-shadow: none; }
      .sun-pad-wrap { justify-content: center; }

      /* Comfortable touch targets across the mobile controls. */
      .sheet .ui-btn { min-height: 44px; }
      .sheet .seg-btn { min-height: 44px; }
      .toggle-grid .ui-btn { min-height: 48px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Planet name labels for the wide (System) overview — built/populated by
       EarthScene.setupPlanetLabels(). The layer container is pointer-events:none
       so orbit/zoom/tap on the canvas still works; each individual .planet-label
       re-enables pointer-events and carries a data-focus so clicking it flies
       to that planet (handled by the delegated body click handler). -->
  <div id="planet-labels" role="group" aria-label="Planets"></div>

  <!-- Loading overlay (EarthScene adds .done and removes this element on completion) -->
  <div id="loading">
    <div class="loading-inner">
      <div class="loading-title">🌍</div>
      <div class="loading-track"><div id="loading-fill"></div></div>
      <div id="loading-label">Loading…</div>
    </div>
  </div>

  <div class="hint-text" id="hint">Drag to rotate &bull; Pinch to zoom</div>

  <!-- Desktop: primary control bar (focus + scene toggles + fullscreen) -->
  <div class="primary-bar" id="primary-bar">
    <div class="pb-group">
      <span class="pb-label">Planets</span>
      <button class="ui-btn active" data-focus="system" aria-pressed="true" title="Whole-system top-down overview">System</button>
      <button class="ui-btn" data-focus="sun" aria-pressed="false" title="Fly to the Sun">Sun</button>
      <button class="ui-btn" data-focus="mercury" aria-pressed="false" title="Fly to Mercury">Mercury</button>
      <button class="ui-btn" data-focus="venus" aria-pressed="false" title="Fly to Venus">Venus</button>
      <button class="ui-btn" data-focus="earth" aria-pressed="false" title="Fly to Earth">Earth</button>
      <button class="ui-btn" data-focus="mars" aria-pressed="false" title="Fly to Mars and its two moons">Mars</button>
      <button class="ui-btn" data-focus="jupiter" aria-pressed="false" title="Fly to Jupiter and its four Galilean moons">Jupiter</button>
      <button class="ui-btn" data-focus="saturn" aria-pressed="false" title="Fly to Saturn and its rings">Saturn</button>
      <button class="ui-btn" data-focus="uranus" aria-pressed="false" title="Fly to Uranus and its five moons">Uranus</button>
      <button class="ui-btn" data-focus="neptune" aria-pressed="false" title="Fly to Neptune and Triton">Neptune</button>
      <button class="ui-btn" data-focus="pluto" aria-pressed="false" title="Fly to Pluto and Charon">Pluto</button>
    </div>
    <div class="pb-divider"></div>
    <div class="pb-group">
      <button class="ui-btn active" data-action="auto-rotate" aria-pressed="true">Auto Rotate</button>
      <button class="ui-btn active" data-action="atmosphere" aria-pressed="true">Atmosphere</button>
      <button class="ui-btn active" data-action="clouds" aria-pressed="true">Clouds</button>
      <button class="ui-btn active" data-action="labels" aria-pressed="true" title="Show planet name labels in the wide System view">Labels</button>
      <button class="ui-btn" data-action="reset">Reset</button>
    </div>
    <div class="pb-divider"></div>
    <div class="pb-group">
      <button class="ui-btn" data-action="fullscreen">Fullscreen</button>
    </div>
  </div>
  <div class="sun-panel" id="sun-panel">
    <div class="sun-panel-header">
      <span class="sun-panel-title">Sun Lighting</span>
      <div class="sun-head-actions">
        <button class="sun-auto-btn sun-manual" data-action="auto-sun" title="Auto-orbit the Sun">Auto</button>
        <button class="icon-btn" data-action="collapse-sun" title="Collapse">&#8722;</button>
      </div>
    </div>
    <div class="sun-body">
      <div class="sun-pad-wrap sun-manual">
        <div class="sun-pad" id="sun-pad" title="Drag: left/right = azimuth, up/down = elevation">
          <div class="sun-pad-ring"></div>
          <div class="sun-pad-knob" id="sun-knob"></div>
        </div>
        <div class="sun-readout">
          <!-- initial values are populated from EarthScene on startup
               (INITIAL_SUN_AZIMUTH / INITIAL_SUN_ELEVATION) — do not hardcode
               them here, they would drift from the TS constants -->
          <div>Azimuth&nbsp; <b><span id="sun-az-val"></span>&deg;</b></div>
          <div>Elev.&nbsp;&nbsp;&nbsp;&nbsp; <b><span id="sun-el-val"></span>&deg;</b></div>
        </div>
      </div>
      <div class="sun-sliders sun-manual">
        <div class="sun-slider-row">
          <label>Azimuth</label>
          <input type="range" id="sun-az" class="sun-range" min="-180" max="180" step="1">
        </div>
        <div class="sun-slider-row">
          <label>Elevation</label>
          <input type="range" id="sun-el" class="sun-range" min="-90" max="90" step="1">
        </div>
      </div>
      <div class="sun-presets">
        <button class="sun-preset sun-preset-full" data-preset="full-daylight" title="Sun follows the camera — the visible hemisphere stays fully daylight">Full Daylight</button>
        <button class="sun-preset sun-manual" data-preset="day">Day</button>
        <button class="sun-preset sun-manual" data-preset="sunset">Sunset</button>
        <button class="sun-preset sun-manual" data-preset="night">Night</button>
        <button class="sun-preset sun-manual" data-preset="backlit">Backlit</button>
      </div>
      <label class="sun-softfill" title="Optional subtle studio fill — slightly lifts deep limb shadows while keeping the spherical look">
        <input type="checkbox" id="sun-softfill"> Soft Daylight fill
      </label>
      <button class="sun-reset sun-manual" data-action="reset-sun">Reset Sun</button>
    </div>
  </div>
  <div class="focus-panel" id="focus-panel">
    <div class="focus-row" id="focus-moons-row">
      <span class="focus-label">Moons</span>
      <div class="seg-group" id="focus-moons"></div>
    </div>
    <div class="focus-row">
      <span class="focus-label">Orbit</span>
      <div class="seg-group">
        <button class="seg-btn" data-orbit="paused">Paused</button>
        <button class="seg-btn active" data-orbit="visualized">Visualized</button>
        <button class="seg-btn" data-orbit="realtime">Real Time</button>
      </div>
    </div>
    <div class="focus-row">
      <span class="focus-label">Orbit Ring Brightness</span>
      <input type="range" class="ring-range" data-rings min="0" max="250" step="1" value="250" aria-label="Orbit ring brightness" title="Orbit ring brightness">
    </div>
    <div class="focus-row">
      <span class="focus-label">Distance</span>
      <div class="seg-group">
        <button class="seg-btn active" data-scale="explore">Exploration</button>
        <button class="seg-btn" data-scale="real">Real Scale</button>
      </div>
    </div>
    <div class="focus-row">
      <span class="focus-label">Quality</span>
      <div class="seg-group">
        <button class="seg-btn active" data-quality="auto" aria-pressed="true">Auto</button>
        <button class="seg-btn" data-quality="high" aria-pressed="false">High</button>
        <button class="seg-btn" data-quality="balanced" aria-pressed="false">Balanced</button>
        <button class="seg-btn" data-quality="performance" aria-pressed="false">Performance</button>
      </div>
    </div>
  </div>
  <!-- Mobile: bottom sheet (the collapsed peek acts as the always-visible control bar) -->
  <div class="sheet" id="sheet" data-sheet="collapsed" role="dialog" aria-label="Scene controls">
    <div class="sheet-handle" id="sheet-handle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <span class="sheet-title">Controls</span>
        <div class="sheet-actions">
          <button class="sheet-toggle" id="sheet-toggle" aria-expanded="false" aria-label="Toggle settings">⚙</button>
          <button class="sheet-close" id="sheet-close" aria-label="Close settings">&#10005;</button>
        </div>
      </div>
    </div>
    <div class="sheet-body">
      <section class="sheet-section">
        <h3>Planets</h3>
        <div class="seg-group sheet-seg">
          <button class="seg-btn active" data-focus="system">System</button>
          <button class="seg-btn" data-focus="mercury">Mercury</button>
          <button class="seg-btn" data-focus="venus">Venus</button>
          <button class="seg-btn" data-focus="earth">Earth</button>
          <button class="seg-btn" data-focus="mars">Mars</button>
          <button class="seg-btn" data-focus="jupiter">Jupiter</button>
          <button class="seg-btn" data-focus="saturn">Saturn</button>
          <button class="seg-btn" data-focus="uranus">Uranus</button>
          <button class="seg-btn" data-focus="neptune">Neptune</button>
          <button class="seg-btn" data-focus="pluto">Pluto</button>
        </div>
      </section>
      <section class="sheet-section">
        <h3>Earth System</h3>
        <div class="seg-group sheet-seg">
          <button class="seg-btn" data-focus="moon">Moon</button>
          <button class="seg-btn" data-focus="sun">Sun</button>
        </div>
      </section>
      <section class="sheet-section" id="sheet-moons-section">
        <h3>Moons</h3>
        <div class="seg-group sheet-seg" id="sheet-moons"></div>
      </section>
      <section class="sheet-section">
        <h3>Orbit</h3>
        <div class="seg-group sheet-seg">
          <button class="seg-btn" data-orbit="paused">Paused</button>
          <button class="seg-btn active" data-orbit="visualized">Visualized</button>
          <button class="seg-btn" data-orbit="realtime">Real Time</button>
        </div>
        <div class="ring-row">
          <label class="ring-label" for="ring-brightness-sheet">Orbit Ring Brightness</label>
          <input type="range" class="ring-range" id="ring-brightness-sheet" data-rings min="0" max="250" step="1" value="250" aria-label="Orbit ring brightness">
        </div>
      </section>
      <section class="sheet-section">
        <h3>Distance</h3>
        <div class="seg-group sheet-seg">
          <button class="seg-btn active" data-scale="explore">Exploration</button>
          <button class="seg-btn" data-scale="real">Real Scale</button>
        </div>
      </section>
      <section class="sheet-section">
        <h3>Quality</h3>
        <div class="seg-group sheet-seg">
          <button class="seg-btn active" data-quality="auto">Auto</button>
          <button class="seg-btn" data-quality="high">High</button>
          <button class="seg-btn" data-quality="balanced">Balanced</button>
          <button class="seg-btn" data-quality="performance">Performance</button>
        </div>
      </section>
      <section class="sheet-section">
        <h3>Scene</h3>
        <div class="toggle-grid">
          <button class="ui-btn active" data-action="auto-rotate">Auto Rotate</button>
          <button class="ui-btn active" data-action="atmosphere">Atmosphere</button>
          <button class="ui-btn active" data-action="clouds">Clouds</button>
          <button class="ui-btn active" data-action="labels">Labels</button>
          <button class="ui-btn" data-action="reset">Reset</button>
          <button class="ui-btn" data-action="fullscreen">Fullscreen</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
